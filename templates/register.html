<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PZchecker</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #000000;
            --card-bg: rgba(0, 20, 10, 0.6);
            --card-bg-2: rgba(0, 30, 15, 0.7);
            --border: rgba(0, 255, 100, 0.15);
            --border-2: rgba(0, 255, 100, 0.3);
            --text: #d0ffe0;
            --text-dim: #4a8a5a;
            --text-dimmer: #2a4a35;
            --green: #00ff66;
            --green-glow: rgba(0, 255, 100, 0.4);
            --green-soft: rgba(0, 255, 100, 0.08);
            --red: #ff3355;
            --cyan: #00e5ff;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            position: relative;
        }
        #matrix-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.55; }
        .scanlines {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
            mix-blend-mode: overlay;
        }
        .vignette {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        }
        .top-glow {
            position: fixed; top: 0; left: 0; right: 0; height: 300px; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at top, rgba(0,255,100,0.15), transparent 70%);
        }
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
        }
        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-2);
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 0 60px rgba(0, 255, 100, 0.1), 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            opacity: 0.6;
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .auth-logo .logo-icon {
            width: 34px; height: 34px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--green), #00aa44);
            display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 1.05rem; font-weight: 800;
            box-shadow: 0 0 25px var(--green-glow);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 25px var(--green-glow); }
            50% { box-shadow: 0 0 40px var(--green-glow); }
        }
        .auth-logo .logo-text {
            font-size: 1.4rem; font-weight: 800;
            color: var(--green);
            text-shadow: 0 0 15px var(--green-glow);
        }
        .auth-logo .logo-badge {
            background: var(--green);
            color: #000;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .auth-card h1 {
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--green);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--green-glow);
        }
        .auth-card h1::before { content: '$ '; color: var(--text-dim); }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg-2);
            color: var(--text);
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 255, 100, 0.1), 0 0 20px rgba(0, 255, 100, 0.1);
        }
        .form-group input::placeholder { color: var(--text-dimmer); }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--green);
            background: linear-gradient(135deg, rgba(0, 255, 100, 0.15), rgba(0, 200, 80, 0.1));
            color: var(--green);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            margin-top: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
            text-shadow: 0 0 8px var(--green-glow);
        }
        .btn-primary:hover {
            box-shadow: 0 0 50px rgba(0, 255, 100, 0.4);
            transform: translateY(-1px);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .auth-footer a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 8px var(--green-glow);
        }
        .auth-footer a:hover { text-decoration: underline; }
        .flash-messages { margin-bottom: 20px; }
        .flash {
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }
        .flash.error { background: rgba(255, 51, 85, 0.1); border: 1px solid rgba(255, 51, 85, 0.3); color: var(--red); }
        .flash.success { background: rgba(0, 255, 100, 0.1); border: 1px solid rgba(0, 255, 100, 0.3); color: var(--green); }
        .flash.info { background: rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.3); color: var(--cyan); }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="top-glow"></div>

<div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">&#10003;</div>
                <span class="logo-text">PZ</span>
                <span class="logo-badge">Checker</span>
            </div>

<h1>Create Account</h1>
            <p class="subtitle">// Register to start checking</p>

{% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

<form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Repeat your password" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>

<div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>

<script>
        (function matrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, columns, drops;
            const fontSize = 14;
            const chars = '0123456789ABCDEF<>{}[]()/\\|=+-*&^%$#@!?';
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                columns = Math.floor(width / fontSize);
                drops = [];
                for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;
            }
            resize();
            window.addEventListener('resize', resize);
            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
                ctx.fillRect(0, 0, width, height);
                ctx.font = fontSize + 'px JetBrains Mono, monospace';
                ctx.shadowColor = '#00ff66';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;
                    if (Math.random() > 0.975) {
                        ctx.fillStyle = '#aaffcc';
                        ctx.shadowBlur = 15;
                    } else {
                        ctx.fillStyle = '#00ff66';
                        ctx.shadowBlur = 6;
                    }
                    ctx.fillText(text, x, y);
                    if (y > height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
        })();
    </script>
</body>
</html>
